[project]
name = "context-compaction-lab"
version = "0.1.1"
description = "Stochastic research on expected API cost and context compaction thresholds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "sympy>=1.14,<2",
    "matplotlib>=3.10,<4",
]

[project.scripts]
compaction-lab = "context_compaction_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
addopts = "-ra --basetemp=.temp/pytest"

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/context_compaction_lab"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/docs", "/tests", "/experiments", "/README.md", "/pyproject.toml", "/uv.lock"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
